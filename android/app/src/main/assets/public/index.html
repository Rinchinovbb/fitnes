<style>
/* Layout: одна колонка до 560px, нижняя навигация, тренировка открывается поверх на весь экран */
:root {
  --bg: #F2F3F0;
  --surface: #FFFFFF;
  --ink: #14181F;
  --muted: #5B6470;
  --line: #DCDFD9;
  --accent: #2740F5;
  --accent-ink: #FFFFFF;
  --accent-soft: #E3E7FF;
  --ok: #12805C;
  --danger: #B3261E;
  --inverse: #14181F;
  --inverse-ink: #F2F3F0;
  --font-display: "Fira Sans Condensed", "Arial Narrow", Arial, sans-serif;
  --font-body: "Fira Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1116; --surface: #171B22; --ink: #ECEFF4; --muted: #9AA3B0; --line: #272D37;
    --accent: #8C99FF; --accent-ink: #0B0E14; --accent-soft: #202649; --ok: #4CC79A; --danger: #FF8A80;
    --inverse: #ECEFF4; --inverse-ink: #0E1116; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1116; --surface: #171B22; --ink: #ECEFF4; --muted: #9AA3B0; --line: #272D37;
  --accent: #8C99FF; --accent-ink: #0B0E14; --accent-soft: #202649; --ok: #4CC79A; --danger: #FF8A80;
  --inverse: #ECEFF4; --inverse-ink: #0E1116; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: auto; }
body {
  background: var(--bg); color: var(--ink);
  font: 16px/1.45 var(--font-body);
  padding-inline: 16px; padding-block: 0;
  -webkit-tap-highlight-color: transparent;
}
body.lock { overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.wrap { max-width: 560px; margin-inline: auto; padding-block: 20px 110px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; letter-spacing: .01em; margin: 0; text-wrap: balance; line-height: 1.05; }
h1 { font-size: 2.6rem; text-transform: uppercase; }
h2 { font-size: 1.7rem; text-transform: uppercase; }
h3 { font-size: 1.35rem; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: .875rem; }
.eyebrow { font-size: .78rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.num { font-family: var(--font-display); font-weight: 700; font-variant-numeric: tabular-nums; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.row > * { min-width: 0; }
.spread { justify-content: space-between; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
.hero { background: var(--inverse); color: var(--inverse-ink); border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.hero .eyebrow { color: inherit; opacity: .7; }
.hero h2 { font-size: 2.2rem; }
.hero ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: .95rem; }
.hero li { display: flex; justify-content: space-between; gap: 12px; border-top: 1px solid color-mix(in srgb, var(--inverse-ink) 18%, transparent); padding-top: 6px; }
.hero li span:last-child { opacity: .7; white-space: nowrap; font-variant-numeric: tabular-nums; }

.btn { border: 0; border-radius: 12px; padding: 14px 18px; font-weight: 600; background: var(--accent); color: var(--accent-ink); min-height: 48px; }
.btn.block { width: 100%; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn.danger { background: transparent; color: var(--danger); border: 1px solid var(--line); }
.btn.on-dark { background: var(--inverse-ink); color: var(--inverse); }
.link { background: none; border: 0; color: var(--accent); font-weight: 600; padding: 10px 0; min-height: 44px; }
.link.danger { color: var(--danger); }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.stat .num { font-size: 2rem; line-height: 1; display: block; }
.stat .small { display: block; margin-top: 4px; }

.field { display: flex; gap: 10px; align-items: stretch; }
.field input, .sel {
  background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 48px; min-width: 0; flex: 1;
}
details.card summary { cursor: pointer; font-weight: 600; min-height: 28px; }
details.card ol { margin: 10px 0 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }

/* Навигация */
.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  background: var(--surface); border-top: 1px solid var(--line);
  padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px));
  display: flex; justify-content: center;
}
.nav-in { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; width: 100%; max-width: 560px; }
.tab { background: none; border: 0; border-radius: 10px; padding: 8px 4px; display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--muted); font-size: .75rem; font-weight: 600; min-height: 52px; }
.tab svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tab[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }

/* Программы */
.prog { display: flex; flex-direction: column; gap: 12px; }
.prog[data-active="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.pill { display: inline-block; font-size: .75rem; font-weight: 600; padding: 3px 9px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); }
.days { display: flex; flex-direction: column; gap: 8px; }
.day { display: flex; align-items: center; justify-content: space-between; gap: 10px; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.day .btn { min-height: 40px; padding: 8px 14px; }

/* Журнал */
.log { display: flex; flex-direction: column; gap: 10px; }
.log-top { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; background: none; border: 0; padding: 0; text-align: left; width: 100%; }
.log table { width: 100%; border-collapse: collapse; font-size: .9rem; }
.log td { padding: 4px 0; border-top: 1px solid var(--line); vertical-align: top; }
.log td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
.tag { font-size: .7rem; padding: 2px 7px; border-radius: 6px; border: 1px solid var(--line); color: var(--muted); }

/* Графики */
.chart { width: 100%; height: auto; display: block; }
.ct { fill: var(--muted); font: 500 11px var(--font-body); }
.cv { fill: var(--ink); font: 700 13px var(--font-display); }
.grid { stroke: var(--line); stroke-width: 1; }
.bar { fill: var(--accent); }
.bar.zero { fill: var(--line); }
.tgt { stroke: var(--ink); stroke-width: 1; stroke-dasharray: 4 3; opacity: .5; }
.ln { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.dot { fill: var(--surface); stroke: var(--accent); stroke-width: 2.5; }
.dot.last { fill: var(--accent); }


/* Конструктор планов */
.txt { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 48px; min-width: 0; }
.txt:focus-visible { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.mini { display: flex; flex-direction: column; gap: 4px; font-size: .75rem; color: var(--muted); font-weight: 600; min-width: 0; }
.mini .txt { color: var(--ink); font-size: 1rem; font-weight: 400; }
.tri { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ed-ex { border-top: 1px solid var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 10px; }
.chip { border: 1px solid var(--line); border-radius: 99px; padding: 8px 14px; min-height: 44px; background: none; font-weight: 600; }
.chip[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.icon-btn { width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: none; font-size: 1.1rem; display: grid; place-items: center; }
.icon-btn:disabled { opacity: .35; cursor: default; }
.grow { flex: 1; }
.opts { display: flex; flex-wrap: wrap; gap: 8px; }

/* Тренировка */
#workout { position: fixed; inset: 0; z-index: 20; background: var(--bg); overflow-y: auto; overscroll-behavior: contain; }
.wk-head {
  position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--line);
  padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px;
}
.wk-head-in, .wk-in { max-width: 560px; margin-inline: auto; }
.wk-in { padding: 16px 16px 24px; display: flex; flex-direction: column; gap: 14px; }
.wk-head-in { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.clock { font-size: 1.6rem; }
.ex { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.ex-top { display: flex; flex-direction: column; gap: 2px; }
.prev { font-size: .85rem; color: var(--muted); }
.sets { display: flex; flex-direction: column; gap: 8px; }
.set { display: grid; grid-template-columns: 28px 1fr 1fr 52px; gap: 8px; align-items: center; }
.set .sn { font-family: var(--font-display); font-weight: 700; font-size: 1.2rem; color: var(--muted); text-align: center; }
.set:not(:has(.fld-w)) { grid-template-columns: 28px 1fr 52px; }
.fld { display: flex; align-items: center; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding-right: 10px; min-width: 0; }
.fld input { width: 100%; min-width: 0; border: 0; background: transparent; padding: 12px 10px; font-family: var(--font-display); font-weight: 700; font-size: 1.3rem; font-variant-numeric: tabular-nums; }
.fld input:focus-visible { outline: none; }
.fld:focus-within { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.fld i { font-style: normal; font-size: .8rem; color: var(--muted); }
.chk { width: 52px; height: 48px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); display: grid; place-items: center; }
.chk svg { width: 24px; height: 24px; stroke: var(--muted); fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.set.done .chk { background: var(--ok); border-color: var(--ok); }
.set.done .chk svg { stroke: var(--surface); }
.set.done .fld { opacity: .6; }
.wk-foot { display: flex; flex-direction: column; gap: 10px; margin-top: 6px; }

#rest {
  position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 30;
  max-width: 536px; margin-inline: auto;
  background: var(--inverse); color: var(--inverse-ink); border-radius: 16px; padding: 14px 16px;
  display: flex; flex-direction: column; gap: 10px; box-shadow: 0 8px 28px rgba(0,0,0,.28);
}
#rest .big { font-size: 2.6rem; line-height: 1; }
.meter { height: 6px; background: color-mix(in srgb, var(--inverse-ink) 22%, transparent); border-radius: 99px; overflow: hidden; }
.meter > div { height: 100%; width: 100%; background: var(--inverse-ink); transform-origin: left; }
#rest .btn { background: color-mix(in srgb, var(--inverse-ink) 16%, transparent); color: var(--inverse-ink); min-height: 44px; padding: 8px 14px; }
#rest.over .meter > div { background: var(--ok); }

#toast {
  position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 50;
  background: var(--inverse); color: var(--inverse-ink); padding: 10px 16px; border-radius: 99px; font-weight: 600; font-size: .9rem; max-width: 90vw; text-align: center;
}
.empty { text-align: left; display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
@media (prefers-reduced-motion: no-preference) {
  .meter > div { transition: transform .25s linear; }
}
@media (max-width: 380px) {
  h1 { font-size: 2.2rem; }
  .stats { gap: 6px; }
  .stat { padding: 10px 8px; }
}
</style>

  /* ---------- Тренировка ---------- */
  function lastOf(name) {

        var e = logs[i].ex[j];

          return { w: mx, txt: e.sets.map(function (s) { return (e.w ? fmt(s.w) + '×' : '') + fmt(s.r); }).join(', ') };
        }

    }

  }
  function startWorkout(pid, di) {

      ex: d.ex.map(function (e) {
        var last = lastOf(e.n), sets = [];
        for (var i = 0; i < e.s; i++) sets.push({ w: e.w && last && last.w ? String(last.w).replace('.', ',') : '', r: '', done: false });

      })

  }
  function setHtml(e, ei, s, si) {

  /* ---------- Таймер отдыха ---------- */
  var rest = null, restTimer = null, ac = null, wake = null;
  function ensureAudio() { try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); } catch (e) {} }
  function beep() {
    try {
      ensureAudio(); if (!ac) return;
      [0, 0.22].forEach(function (t) {
        var o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = 880; g.gain.value = 0.15;

    try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (e2) {}
  }
  function requestWake() { try { if (navigator.wakeLock) navigator.wakeLock.request('screen').then(function (w) { wake = w; }, function () {}); } catch (e) {} }
  function releaseWake() { try { if (wake) wake.release(); } catch (e) {} wake = null; }
  function startRest(sec) {

        '<div class="meter"><div id="restBar"></div></div>';

  }

  /* ---------- Действия ---------- */

  function demo() {
    var p = prog('full'), out = [], base = { 'Приседания с гантелью': 16, 'Жим гантелей лёжа': 14, 'Тяга гантели в наклоне': 14, 'Жим гантелей сидя': 10, 'Румынская тяга с гантелями': 18, 'Тяга верхнего блока': 40, 'Выпады назад': 10, 'Гоблет-приседания': 18, 'Ягодичный мостик': 20, 'Подъём гантелей в стороны': 6 };
    var seq = [0, 1, 2, 0, 1, 2, 0, 1, 2, 0], now = new Date();
    for (var i = 0; i < seq.length; i++) {
      var dt = new Date(now.getFullYear(), now.getMonth(), now.getDate() - (seq.length - 1 - i) * 3 - 1), day = p.days[seq[i]], step = Math.floor(i / 3);
      out.push({ id: dt.getTime() + i, demo: true, date: dateKey(dt), prog: p.id, progName: p.name, dayName: day.name + ' · ' + day.focus, min: 48 + (i % 4) * 4,
        ex: day.ex.map(function (e) {
          var w = e.w ? (base[e.n] || 10) + step * 2 : 0, sets = [];
          for (var k = 0; k < e.s; k++) sets.push({ w: w, r: e.u === 'сек' ? 30 + step * 5 : Math.max(6, +firstNum(e.r) - (k === e.s - 1 ? 1 : 0)) });
          return { n: e.n, w: e.w, sets: sets };
        }) });
    }
    state.logs = state.logs.concat(out);
    if (!state.weights.length) for (var j = 0; j < 6; j++) { var wd = new Date(now.getFullYear(), now.getMonth(), now.getDate() - (5 - j) * 6); state.weights.push({ d: dateKey(wd), v: Math.round((74.2 - j * 0.45) * 10) / 10, demo: true }); }
    save(); render(); toast('Добавлены примеры. Их можно убрать в журнале.');
  }

  function focusId(id) { setTimeout(function () { var el = document.getElementById(id); if (el) el.focus(); }, 0); }
  function focusSel(sel) { setTimeout(function () { var el = document.querySelector(sel); if (el && !el.disabled) el.focus(); }, 0); }
  function saveEditor() {
    var E = state.editor; if (!E) return;
    var days = E.days.map(function (d, i) {
      var ex = d.ex.filter(function (x) { return String(x.n).trim(); }).map(function (x) {
        var o = { n: String(x.n).trim(), s: clampN(x.s, 1, 10, 3), r: String(x.r).trim() || (x.u === 'сек' ? '40' : '10'), rest: clampN(x.rest, 0, 600, 60), w: x.w ? 1 : 0 };
        if (x.u === 'сек') o.u = 'сек';
        return o;
      });
      return { name: String(d.name).trim() || 'День ' + (i + 1), focus: String(d.focus || '').trim(), ex: ex };
    }).filter(function (d) { return d.ex.length; });
    if (!days.length) { toast('Добавь хотя бы одно упражнение с названием'); return; }
    var id = E.id || 'c' + Date.now();
    var plan = { id: id, custom: true, name: String(E.name).trim() || 'Мой план', level: 'Свой', per: days.length, about: E.about || 'Свой план тренировок.', days: days };
    var found = false;
    state.custom = state.custom.map(function (c) { if (c.id === id) { found = true; return plan; } return c; });
    if (!found) state.custom.push(plan);
    state.program = id; state.dayIdx[id] = 0; state.editor = null; state.tab = 'programs';
    save(); render(); window.scrollTo(0, 0); toast('План сохранён и выбран активным');
  }

  document.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-act]'); if (!b || b.tagName === 'SELECT') return;
    var a = b.dataset.act;
    if (a === 'tab') { state.tab = b.dataset.t; state.open = null; render(); window.scrollTo(0, 0); }
    else if (a === 'start') { startWorkout(b.dataset.p, +b.dataset.d); }
    else if (a === 'resume') { renderWorkout(); }
    else if (a === 'hide') { $('#workout').hidden = true; document.body.classList.remove('lock'); var r = $('#rest'); if (r) r.remove(); window.scrollTo(0, 0); }
    else if (a === 'pick') { state.program = b.dataset.p; save(); render(); toast('Программа выбрана'); }
    else if (a === 'target') { state.target = +b.dataset.n; save(); render(); }
    else if (a === 'saveWeight') {
      var v = num($('#bw').value); if (v < 20 || v > 400) { toast('Введи вес от 20 до 400 кг'); return; }
      var k = dateKey(new Date()); state.weights = state.weights.filter(function (w) { return w.d !== k; }); state.weights.push({ d: k, v: v });
      state.weights.sort(function (x, y) { return x.d < y.d ? -1 : 1; }); save(); render(); toast('Вес записан');
    }
    else if (a === 'toggleLog') { var id = +b.dataset.id; state.open = state.open === id ? null : id; render(); }
    else if (a === 'delLog') { var did = +b.dataset.id; confirmTwice(b, 'Точно удалить?', function () { state.logs = state.logs.filter(function (l) { return l.id !== did; }); state.open = null; save(); render(); toast('Запись удалена'); }); }
    else if (a === 'demo') { demo(); }
    else if (a === 'clearDemo') { state.logs = state.logs.filter(function (l) { return !l.demo; }); state.weights = state.weights.filter(function (w) { return !w.demo; }); save(); render(); toast('Примеры убраны'); }
    else if (a === 'addSet') {
      var e = state.draft.ex[+b.dataset.e], prev = e.sets[e.sets.length - 1];
      e.sets.push({ w: prev ? prev.w : '', r: '', done: false }); save(); renderWorkout();
    }
    else if (a === 'done') {
      ensureAudio();
      var row = b.closest('.set'), ei = +row.dataset.e, si = +row.dataset.s, ex = state.draft.ex[ei], s = ex.sets[si];
      s.done = !s.done;
      if (s.done && !s.r) { s.r = firstNum(ex.r); var ri = $('input[data-k="r"]', row); if (ri) ri.value = s.r; }
      row.classList.toggle('done', s.done); b.setAttribute('aria-pressed', s.done); save();
      var lastEx = ei === state.draft.ex.length - 1, lastSet = si === ex.sets.length - 1;
      if (s.done && !(lastEx && lastSet)) startRest(ex.rest); else if (!s.done) stopRest();
    }
    else if (a === 'restAdd') { if (rest) { rest.end += +b.dataset.n * 1000; rest.total = Math.max(5, rest.total + +b.dataset.n); rest.fired = false; var o = $('#rest'); if (o) o.classList.remove('over'); tick(); } }
    else if (a === 'skipRest') { stopRest(); }
    else if (a === 'gen') { state.tab = 'generate'; save(); render(); window.scrollTo(0, 0); }
    else if (a === 'genSet') { state.gen[b.dataset.k] = b.dataset.k === 'days' ? +b.dataset.v : b.dataset.v; save(); render(); }
    else if (a === 'genRun') { state.editor = toEditor(genPlan(state.gen), null); state.editor.generated = true; state.tab = 'editor'; save(); render(); window.scrollTo(0, 0); toast('План составлен. Проверь и сохрани'); }
    else if (a === 'newPlan') { state.editor = { id: null, name: '', about: '', days: [{ name: 'День 1', focus: '', ex: [{ n: '', s: '3', r: '10', rest: '75', w: 1, u: '' }] }] }; state.tab = 'editor'; save(); render(); window.scrollTo(0, 0); }
    else if (a === 'editPlan' || a === 'copyPlan') {
      var src = prog(b.dataset.p); state.editor = toEditor(src, a === 'editPlan' ? src.id : null);
      if (a === 'copyPlan') state.editor.name = src.name + ' (копия)';
      state.tab = 'editor'; save(); render(); window.scrollTo(0, 0);
    }
    else if (a === 'delPlan') {
      var pid = b.dataset.p;
      if (state.draft && state.draft.prog === pid) { toast('Сначала закончи или отмени текущую тренировку'); return; }
      confirmTwice(b, 'Точно удалить?', function () { state.custom = state.custom.filter(function (c) { return c.id !== pid; }); if (state.program === pid) state.program = 'full'; save(); render(); toast('План удалён'); });
    }
    else if (a === 'resumeEd') { state.tab = 'editor'; render(); window.scrollTo(0, 0); }
    else if (a === 'dropEd') { confirmTwice(b, 'Точно удалить?', function () { state.editor = null; save(); render(); }); }
    else if (a === 'edAddDay') { var E1 = state.editor; E1.days.push({ name: 'День ' + (E1.days.length + 1), focus: '', ex: [{ n: '', s: '3', r: '10', rest: '75', w: 1, u: '' }] }); save(); render(); focusId('dn-' + (E1.days.length - 1)); }
    else if (a === 'edDelDay') { var di1 = +b.dataset.d; confirmTwice(b, 'Точно удалить день?', function () { state.editor.days.splice(di1, 1); save(); render(); }); }
    else if (a === 'edAddEx') { var di2 = +b.dataset.d, D2 = state.editor.days[di2]; D2.ex.push({ n: '', s: '3', r: '10', rest: '75', w: 1, u: '' }); save(); render(); focusId('x-' + di2 + '-' + (D2.ex.length - 1) + '-n'); }
    else if (a === 'edDelEx') { var di3 = +b.dataset.d, xi3 = +b.dataset.e; state.editor.days[di3].ex.splice(xi3, 1); save(); render(); }
    else if (a === 'edMove') {
      var di4 = +b.dataset.d, xi4 = +b.dataset.e, to4 = xi4 + (+b.dataset.dir), L4 = state.editor.days[di4].ex;
      if (to4 >= 0 && to4 < L4.length) { var tmp = L4[xi4]; L4[xi4] = L4[to4]; L4[to4] = tmp; save(); render(); focusSel('[data-act="edMove"][data-d="' + di4 + '"][data-e="' + to4 + '"][data-dir="' + b.dataset.dir + '"]'); }
    }
    else if (a === 'edTog') {
      var X5 = state.editor.days[+b.dataset.d].ex[+b.dataset.e];
      if (b.dataset.k === 'w') X5.w = X5.w ? 0 : 1;
      else { X5.u = X5.u === 'сек' ? '' : 'сек'; X5.r = X5.u === 'сек' ? '40' : '10'; }
      save(); render();
    }
    else if (a === 'edSave') { saveEditor(); }
    else if (a === 'edCancel') { confirmTwice(b, 'Точно отменить? Изменения пропадут', function () { state.editor = null; state.tab = 'programs'; save(); render(); window.scrollTo(0, 0); }); }
    else if (a === 'finish') { finish(); }
    else if (a === 'cancel') { confirmTwice(b, 'Точно отменить? Данные пропадут', function () { state.draft = null; save(); stopRest(); releaseWake(); render(); toast('Тренировка отменена'); }); }
  });
  document.addEventListener('change', function (ev) {
    var t = ev.target;
    if (t.dataset && t.dataset.act === 'exSel') { state.exSel = t.value; render(); return; }
    if (t.dataset && t.dataset.ed === 'n' && state.editor) {
      var f = libFind(t.value);
      if (f) {
        var X = state.editor.days[+t.dataset.d].ex[+t.dataset.e];
        X.n = f.n; X.w = f.w ? 1 : 0; X.u = f.u || ''; X.s = '3'; X.r = f.u ? '40' : f.w ? '10' : '12'; X.rest = String(f.u ? 45 : f.w ? 75 : 60);
        save(); render();
      }
    }
  });
  document.addEventListener('input', function (ev) {
    var t = ev.target, ed = t.dataset && t.dataset.ed;
    if (ed && state.editor) {
      var E = state.editor, di = +t.dataset.d, xi = +t.dataset.e;
      if (ed === 'name') E.name = t.value;
      else if (ed === 'dn') E.days[di].name = t.value;
      else if (ed === 'df') E.days[di].focus = t.value;
      else E.days[di].ex[xi][ed] = t.value;
      save(); return;
    }
    var k = t.dataset && t.dataset.k; if (!k || !state.draft) return;
    var row = t.closest('.set'); if (!row) return;
    state.draft.ex[+row.dataset.e].sets[+row.dataset.s][k] = t.value; save();
  });
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') { if (state.draft) requestWake(); tick(); } });
  setInterval(function () { var cl = $('#clock'); if (cl && state.draft) cl.textContent = clock(Date.now() - state.draft.start); }, 1000);

  render();
})();
</script>
</body>
</html>
